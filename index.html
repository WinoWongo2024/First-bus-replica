<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>OnBusOffBus | Live Transit</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --obob-blue: #0059a7;
            --obob-green: #78aa36;
            --obob-dark: #1a1a1a;
            --bg: #f4f7f6;
        }

        body { font-family: 'Inter', sans-serif; margin: 0; background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        #app-shell { width: 385px; height: 800px; background: var(--bg); border-radius: 40px; overflow: hidden; position: relative; display: flex; flex-direction: column; border: 10px solid #222; }

        header { background: var(--obob-blue); color: white; padding: 20px; border-bottom: 4px solid var(--obob-green); }
        .logo { font-weight: 900; font-size: 1.2rem; }
        .logo span { color: var(--obob-green); }

        .screen { flex: 1; display: none; overflow-y: auto; padding: 15px; }
        .screen.active { display: block; }

        /* Search & Stop UI */
        .search-box { background: white; padding: 15px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 15px; }
        .search-input { width: 100%; border: none; font-size: 1rem; outline: none; }
        
        .stop-result { 
            background: white; padding: 15px; border-radius: 12px; margin-bottom: 8px; 
            cursor: pointer; border-left: 5px solid var(--obob-green); transition: 0.2s;
        }
        .stop-result:hover { background: #eee; }
        .stop-name { font-weight: bold; display: block; }
        .stop-code { font-size: 0.7rem; color: #888; }

        /* Bus Arrivals Card */
        .arrival-card { 
            display: flex; justify-content: space-between; align-items: center; 
            background: white; padding: 12px; border-radius: 10px; margin-top: 5px; border: 1px solid #eee;
        }
        .route-badge { background: var(--obob-blue); color: white; padding: 5px 10px; border-radius: 5px; font-weight: 800; }
        .time-due { color: var(--obob-green); font-weight: bold; }

        /* Map Bus Icons */
        .bus-marker {
            background: var(--obob-blue); border: 2px solid white; border-radius: 50%;
            color: white; font-weight: bold; display: flex; align-items: center; justify-content: center;
        }

        nav { background: white; height: 80px; display: flex; border-top: 2px solid #eee; padding-bottom: 20px; }
        nav button { flex: 1; border: none; background: none; color: #aaa; font-size: 0.7rem; font-weight: bold; }
        nav button.active-nav { color: var(--obob-blue); }
    </style>
</head>
<body>

<div id="app-shell">
    <header><div class="logo">On<span>Bus</span>Off<span>Bus</span></div></header>

    <div id="home-screen" class="screen active">
        <div class="search-box">
            <input type="text" class="search-input" placeholder="Enter Stop Name (e.g. Radstock)..." oninput="searchStops(this.value)">
        </div>
        <div id="results-list">
            </div>
    </div>

    <div id="map-screen" class="screen" style="padding:0;"><div id="live-map" style="height:100%"></div></div>

    <div id="fares-screen" class="screen">
        <h3>Your Wallet</h3>
        <div class="stop-result">Bristol Single: <b>VC€ 2.50</b></div>
        <div class="stop-result">Bath Day Pass: <b>VC€ 5.00</b></div>
    </div>

    <nav>
        <button class="active-nav" onclick="showTab('home', this)">🔍 Search</button>
        <button onclick="showTab('map', this)">🗺️ Map</button>
        <button onclick="showTab('fares', this)">🎟️ Tickets</button>
    </nav>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const API_KEY = '5fd1f1f6d3cade37b6edd3bb37192708d2b262dd';
    const REGION = '-2.72,51.27,-2.30,51.52';
    let map, markers = {};

    // --- STOP SEARCH LOGIC ---
    // In a real expansion, this would call the BODS NaPTAN API. 
    // For now, we've indexed the key OBOB hubs.
    const stopDatabase = [
        { name: "Radstock Victoria Park", code: "0180BCA10751", lat: 51.291, lon: -2.448 },
        { name: "Bath Abbey (Stop Cd)", code: "0100BRP10157", lat: 51.381, lon: -2.358 },
        { name: "Bristol Temple Meads", code: "0100BRA10818", lat: 51.449, lon: -2.581 }
    ];

    function searchStops(query) {
        const list = document.getElementById('results-list');
        list.innerHTML = '';
        if (query.length < 3) return;

        const matches = stopDatabase.filter(s => s.name.toLowerCase().includes(query.toLowerCase()));
        matches.forEach(stop => {
            const div = document.createElement('div');
            div.className = 'stop-result';
            div.innerHTML = `
                <span class="stop-name">${stop.name}</span>
                <span class="stop-code">Code: ${stop.code}</span>
                <div id="arrivals-${stop.code}" style="margin-top:10px;">
                    <small>Loading live arrivals...</small>
                </div>
            `;
            div.onclick = () => focusStop(stop);
            list.appendChild(div);
            fetchArrivals(stop.code);
        });
    }

    async function fetchArrivals(stopCode) {
        // Here we use the BODS data to find buses heading to this stop
        // For simulation, we're showing the "Live Feel"
        const target = document.getElementById(`arrivals-${stopCode}`);
        setTimeout(() => {
            target.innerHTML = `
                <div class="arrival-card">
                    <span class="route-badge">172</span> <span>to Bath</span> <span class="time-due">4 mins</span>
                </div>
                <div class="arrival-card">
                    <span class="route-badge">376</span> <span>to Bristol</span> <span class="time-due">11 mins</span>
                </div>
            `;
        }, 1000);
    }

    // --- MAP & LIVE UPDATES ---
    async function updateBuses() {
        const url = `https://data.bus-data.dft.gov.uk/api/v1/datafeed/?boundingBox=${REGION}&api_key=${API_KEY}`;
        const proxy = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;

        try {
            const res = await fetch(proxy);
            const text = await res.text();
            const xml = new DOMParser().parseFromString(text, "text/xml");
            const buses = Array.from(xml.getElementsByTagName("VehicleActivity"));
            
            buses.forEach(b => {
                const id = b.getElementsByTagName("VehicleRef")[0]?.textContent;
                const lat = b.getElementsByTagName("Latitude")[0]?.textContent;
                const lon = b.getElementsByTagName("Longitude")[0]?.textContent;
                const line = b.getElementsByTagName("PublishedLineName")[0]?.textContent;

                if (lat && lon && id && map) {
                    if (markers[id]) {
                        markers[id].setLatLng([lat, lon]);
                    } else {
                        const icon = L.divIcon({
                            className: 'bus-marker',
                            html: line,
                            iconSize: [25, 25]
                        });
                        markers[id] = L.marker([lat, lon], { icon }).addTo(map);
                    }
                }
            });
        } catch (e) { console.error("Update failed"); }
    }

    function focusStop(stop) {
        showTab('map');
        map.setView([stop.lat, stop.lon], 16);
        L.marker([stop.lat, stop.lon]).addTo(map).bindPopup(stop.name).openPopup();
    }

    function showTab(tab, btn) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active-nav'));
        document.getElementById(tab + '-screen').classList.add('active');
        if(btn) btn.classList.add('active-nav');

        if (tab === 'map' && !map) {
            map = L.map('live-map').setView([51.38, -2.36], 11);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        }
    }

    // Update every 5 seconds for performance, 1-second simulation is taxing for BODS free tier
    setInterval(updateBuses, 5000);
</script>
</body>
</html>
