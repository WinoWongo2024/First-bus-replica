<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>OnBusOffBus | Live Transit</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --obob-blue: #0059a7;
            --obob-green: #78aa36;
            --obob-dark: #1a1a1a;
            --bg: #f4f7f6;
        }

        body { font-family: 'Inter', -apple-system, sans-serif; margin: 0; background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        #app-shell { width: 385px; height: 800px; background: var(--bg); border-radius: 40px; overflow: hidden; position: relative; display: flex; flex-direction: column; border: 10px solid #222; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }

        header { background: var(--obob-blue); color: white; padding: 20px; border-bottom: 4px solid var(--obob-green); }
        .logo { font-weight: 900; font-size: 1.2rem; }
        .logo span { color: var(--obob-green); }

        .screen { flex: 1; display: none; overflow-y: auto; padding: 15px; }
        .screen.active { display: block; }

        /* Search UI */
        .search-box { background: white; padding: 15px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 15px; position: sticky; top: 0; z-index: 10; }
        .search-input { width: 100%; border: none; font-size: 1rem; outline: none; }
        
        .stop-result { 
            background: white; padding: 15px; border-radius: 12px; margin-bottom: 10px; 
            cursor: pointer; border-left: 5px solid var(--obob-green); box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .stop-name { font-weight: bold; display: block; color: var(--obob-blue); }
        .stop-code { font-size: 0.7rem; color: #888; }

        /* Arrivals Card */
        .arrivals-area { margin-top: 10px; border-top: 1px solid #eee; padding-top: 8px; }
        .arrival-card { 
            display: flex; justify-content: space-between; align-items: center; 
            background: #fafafa; padding: 8px; border-radius: 8px; margin-top: 5px; 
        }
        .route-badge { background: var(--obob-dark); color: white; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 0.8rem; }
        .time-due { color: var(--obob-green); font-weight: bold; }

        /* Map Bus Icons */
        .bus-marker {
            background: var(--obob-blue); border: 2px solid white; border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg); color: white; font-weight: bold; display: flex; 
            align-items: center; justify-content: center; font-size: 11px;
        }
        .bus-marker span { transform: rotate(45deg); }

        nav { background: white; height: 80px; display: flex; border-top: 2px solid #eee; padding-bottom: 20px; }
        nav button { flex: 1; border: none; background: none; color: #aaa; font-size: 0.7rem; font-weight: bold; cursor: pointer; }
        nav button.active-nav { color: var(--obob-blue); }
    </style>
</head>
<body>

<div id="app-shell">
    <header><div class="logo">On<span>Bus</span>Off<span>Bus</span></div></header>

    <div id="home-screen" class="screen active">
        <h3 style="margin-top: 0;">Live Stop Finder</h3>
        <div class="search-box">
            <input type="text" class="search-input" placeholder="Type a stop (e.g. Radstock, Bath)..." oninput="searchStops(this.value)">
        </div>
        <div id="results-list">
            <p style="color: #888; text-align: center; font-size: 0.9rem;">Start typing to find stops in Bristol, Bath, and Radstock area.</p>
        </div>
    </div>

    <div id="map-screen" class="screen" style="padding:0;"><div id="live-map" style="height:100%"></div></div>

    <div id="fares-screen" class="screen">
        <h3>OnBusOffBus Wallet</h3>
        <div class="stop-result">Bristol Inner Single: <b>VC€ 2.50</b></div>
        <div class="stop-result">Radstock to Bristol: <b>VC€ 5.50</b></div>
        <div class="stop-result">ÖestVèl Day Pass: <b>VC€ 7.00</b></div>
    </div>

    <nav>
        <button id="btn-home" class="active-nav" onclick="showTab('home', this)">🔍 Search</button>
        <button id="btn-map" onclick="showTab('map', this)">🗺️ Map</button>
        <button id="btn-fares" onclick="showTab('fares', this)">🎟️ Tickets</button>
    </nav>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const API_KEY = '5fd1f1f6d3cade37b6edd3bb37192708d2b262dd';
    const REGION_BBOX = '-2.72,51.27,-2.30,51.52';
    let map, markers = {};

    // --- NaPTAN STOP SEARCH ---
    async function searchStops(query) {
        const list = document.getElementById('results-list');
        if (query.length < 3) return;

        // Fetch stops within our expanded region
        const stopApi = `https://data.bus-data.dft.gov.uk/api/v1/stops/?boundingBox=${REGION_BBOX}&api_key=${API_KEY}`;
        const proxy = `https://api.allorigins.win/raw?url=${encodeURIComponent(stopApi)}`;

        try {
            const res = await fetch(proxy);
            const text = await res.text();
            const xml = new DOMParser().parseFromString(text, "text/xml");
            const allStops = Array.from(xml.getElementsByTagName("StopPoint"));

            const matches = allStops.filter(s => {
                const name = s.getElementsByTagName("CommonName")[0]?.textContent || "";
                return name.toLowerCase().includes(query.toLowerCase());
            }).slice(0, 10);

            list.innerHTML = '';
            matches.forEach(stop => {
                const name = stop.getElementsByTagName("CommonName")[0].textContent;
                const atco = stop.getElementsByTagName("AtcoCode")[0].textContent;
                const lat = stop.getElementsByTagName("Latitude")[0].textContent;
                const lon = stop.getElementsByTagName("Longitude")[0].textContent;

                const div = document.createElement('div');
                div.className = 'stop-result';
                div.innerHTML = `
                    <span class="stop-name">${name}</span>
                    <span class="stop-code">Stop ID: ${atco}</span>
                    <div id="arr-${atco}" class="arrivals-area"><small>Calculating arrival times...</small></div>
                `;
                div.onclick = () => focusStop(name, parseFloat(lat), parseFloat(lon));
                list.appendChild(div);
                
                // Simulate individual stop fetching
                setTimeout(() => {
                    document.getElementById(`arr-${atco}`).innerHTML = `
                        <div class="arrival-card">
                            <span class="route-badge">OBOB</span> <span>Live Tracking</span> <span class="time-due">DUE</span>
                        </div>
                    `;
                }, 1200);
            });
        } catch (e) { console.error("Search failed"); }
    }

    // --- LIVE VEHICLE TRACKING ---
    async function updateBuses() {
        const url = `https://data.bus-data.dft.gov.uk/api/v1/datafeed/?boundingBox=${REGION_BBOX}&api_key=${API_KEY}`;
        const proxy = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;

        try {
            const res = await fetch(proxy);
            const text = await res.text();
            const xml = new DOMParser().parseFromString(text, "text/xml");
            const buses = Array.from(xml.getElementsByTagName("VehicleActivity"));
            
            buses.forEach(b => {
                const id = b.getElementsByTagName("VehicleRef")[0]?.textContent;
                const lat = b.getElementsByTagName("Latitude")[0]?.textContent;
                const lon = b.getElementsByTagName("Longitude")[0]?.textContent;
                const line = b.getElementsByTagName("PublishedLineName")[0]?.textContent;

                if (lat && lon && id && map) {
                    if (markers[id]) {
                        markers[id].setLatLng([lat, lon]);
                    } else {
                        const icon = L.divIcon({
                            className: 'bus-marker',
                            html: `<span>${line}</span>`,
                            iconSize: [30, 30]
                        });
                        markers[id] = L.marker([lat, lon], { icon }).addTo(map);
                    }
                }
            });
        } catch (e) { console.error("BODS Sync error"); }
    }

    function focusStop(name, lat, lon) {
        showTab('map', document.getElementById('btn-map'));
        map.setView([lat, lon], 16);
        L.marker([lat, lon]).addTo(map).bindPopup(`<b>${name}</b>`).openPopup();
    }

    function showTab(tab, btn) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active-nav'));
        document.getElementById(tab + '-screen').classList.add('active');
        btn.classList.add('active-nav');

        if (tab === 'map' && !map) {
            map = L.map('live-map').setView([51.38, -2.36], 12);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            updateBuses();
        }
        if (map) setTimeout(() => map.invalidateSize(), 200);
    }

    setInterval(updateBuses, 5000);
</script>
</body>
</html>
