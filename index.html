<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Bus Clone - ÖestVèl Edition</title>
    <style>
        /* Core Branding & Layout */
        :root {
            --primary-purple: #4a154b;
            --primary-magenta: #e3007b;
            --light-grey: #f4f4f4;
            --dark-grey: #333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            background-color: #ccc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Mobile App Container Simulation */
        #app-container {
            width: 375px;
            height: 812px;
            background-color: white;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Header */
        header {
            background-color: var(--primary-purple);
            color: white;
            padding: 20px;
            text-align: center;
            font-weight: bold;
            font-size: 1.2rem;
            border-bottom: 4px solid var(--primary-magenta);
        }

        /* Main Content Areas */
        .screen {
            flex: 1;
            display: none;
            flex-direction: column;
            background-color: var(--light-grey);
            position: relative;
        }

        .screen.active {
            display: flex;
        }

        /* Map & Simulation Styles */
        #map-area {
            flex: 1;
            background-color: #cbe6a3; /* Fake grass/map background */
            position: relative;
            overflow: hidden;
        }

        .road {
            position: absolute;
            background-color: #888;
            width: 100%;
            height: 40px;
            top: 40%;
            display: flex;
            align-items: center;
        }

        .road-line {
            width: 100%;
            height: 2px;
            background-image: linear-gradient(to right, white 50%, transparent 50%);
            background-size: 20px 2px;
        }

        .bus {
            position: absolute;
            width: 40px;
            height: 25px;
            background-color: var(--primary-magenta);
            color: white;
            font-size: 10px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 5px;
            top: 40%;
            margin-top: 7px;
            left: -50px;
            transition: left 0.5s linear;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
        }

        .bus-stop {
            position: absolute;
            top: 35%;
            width: 15px;
            height: 15px;
            background-color: var(--primary-purple);
            border: 2px solid white;
            border-radius: 50%;
            z-index: 10;
        }

        #stop-bath-uni { left: 20%; }
        #stop-city-centre { left: 70%; }

        /* Ticketing Styles */
        #tickets-screen {
            padding: 20px;
        }

        .ticket-card {
            background: white;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            border-left: 5px solid var(--primary-magenta);
        }

        .ticket-price {
            font-size: 1.5rem;
            color: var(--primary-purple);
            font-weight: bold;
            margin-top: 10px;
        }

        .buy-btn {
            background-color: var(--primary-magenta);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
        }

        /* Bottom Navigation */
        nav {
            background-color: white;
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            border-top: 1px solid #ddd;
        }

        nav button {
            background: none;
            border: none;
            color: var(--dark-grey);
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        nav button.active-nav {
            color: var(--primary-magenta);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="app-container">
        <header>ÖestVèl Bus (Bath)</header>

        <div id="map-screen" class="screen active">
            <div id="map-area">
                <div class="road"><div class="road-line"></div></div>
                <div class="bus-stop" id="stop-bath-uni" title="Bath Uni"></div>
                <div class="bus-stop" id="stop-city-centre" title="City Centre"></div>
                
                <div class="bus" id="bus-u1">U1</div>
            </div>
            <div style="padding: 15px; text-align: center; background: white;">
                <strong>Next Bus:</strong> U1 to City Centre in 3 mins
            </div>
        </div>

        <div id="tickets-screen" class="screen">
            <h2>Buy Tickets</h2>
            
            <div class="ticket-card">
                <h3>Bath City Single</h3>
                <p>Valid for one journey.</p>
                <div class="ticket-price">VC€ 2.00</div>
                <button class="buy-btn" onclick="buyTicket('Single')">Buy Ticket</button>
            </div>

            <div class="ticket-card">
                <h3>Bath Day Ticket</h3>
                <p>Unlimited travel for one day.</p>
                <div class="ticket-price">VC€ 4.50</div>
                <button class="buy-btn" onclick="buyTicket('Day')">Buy Ticket</button>
            </div>
        </div>

        <nav>
            <button id="nav-map" class="active-nav" onclick="switchTab('map')">🗺️ Map</button>
            <button id="nav-tickets" onclick="switchTab('tickets')">🎟️ Tickets</button>
        </nav>
    </div>

    <script>
        // --- Navigation Logic ---
        function switchTab(tabName) {
            // Hide all screens
            document.querySelectorAll('.screen').forEach(screen => {
                screen.classList.remove('active');
            });
            // Reset nav buttons
            document.querySelectorAll('nav button').forEach(btn => {
                btn.classList.remove('active-nav');
            });

            // Show selected screen
            document.getElementById(tabName + '-screen').classList.add('active');
            document.getElementById('nav-' + tabName).classList.add('active-nav');
        }

        // --- Ticketing Logic ---
        function buyTicket(type) {
            alert("Success! Your " + type + " ticket has been added to your wallet.");
        }

        // --- Bus Simulation Logic ---
        const busElement = document.getElementById('bus-u1');
        let busPosition = -50; 

        function animateBus() {
            busPosition += 1; // Move right by 1px
            
            // Loop the bus back to the start when it goes off screen
            if (busPosition > 400) {
                busPosition = -50;
            }
            
            busElement.style.left = busPosition + 'px';
            
            // Call next frame
            requestAnimationFrame(animateBus);
        }

        // Start the simulation
        animateBus();
    </script>
</body>
</html>
