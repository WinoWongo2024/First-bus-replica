<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>OnBusOffBus | Bristol - Bath - Radstock</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --obob-blue: #0059a7;
            --obob-green: #78aa36;
            --obob-dark: #1a1a1a;
            --accent: #ffcc00;
            --bg: #f4f7f6;
        }

        body { font-family: 'Inter', sans-serif; margin: 0; background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        #app-shell { width: 385px; height: 800px; background: var(--bg); border-radius: 40px; overflow: hidden; position: relative; display: flex; flex-direction: column; border: 10px solid #222; }

        /* Navigation & Headers */
        header { background: var(--obob-blue); color: white; padding: 20px; text-align: left; border-bottom: 4px solid var(--obob-green); }
        .logo { font-weight: 900; font-size: 1.2rem; }
        .logo span { color: var(--obob-green); }

        .screen { flex: 1; display: none; overflow-y: auto; padding: 15px; }
        .screen.active { display: block; }

        /* --- HOME / SEARCH PAGE --- */
        .search-container { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-top: 20px; }
        .search-input { width: 100%; padding: 15px; border: 2px solid #eee; border-radius: 10px; font-size: 1rem; box-sizing: border-box; outline: none; transition: border 0.3s; }
        .search-input:focus { border-color: var(--obob-blue); }
        .quick-links { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .link-card { background: #eee; padding: 15px; border-radius: 12px; text-align: center; cursor: pointer; font-weight: bold; font-size: 0.8rem; }

        /* --- MAP ICONS --- */
        .bus-icon-div {
            background: var(--obob-blue);
            border: 2px solid white;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            color: white;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            width: 30px !important;
            height: 30px !important;
        }
        .bus-icon-div span { transform: rotate(45deg); }

        /* --- BOTTOM NAV --- */
        nav { background: white; height: 80px; display: flex; border-top: 2px solid #eee; padding-bottom: 20px; }
        nav button { flex: 1; border: none; background: none; color: #aaa; font-size: 0.7rem; font-weight: bold; cursor: pointer; }
        nav button.active-nav { color: var(--obob-blue); }
    </style>
</head>
<body>

<div id="app-shell">
    <header><div class="logo">On<span>Bus</span>Off<span>Bus</span></div></header>

    <div id="home-screen" class="screen active">
        <h2 style="margin-top:0;">Where to?</h2>
        <div class="search-container">
            <input type="text" class="search-input" placeholder="Search by Bus Stop or Route..." oninput="filterResults(this.value)">
            <div class="quick-links">
                <div class="link-card" onclick="showTab('map')">📍 Near Me</div>
                <div class="link-card" onclick="showTab('map')">🏰 Bath City</div>
                <div class="link-card" onclick="showTab('map')">🚢 Bristol Harbour</div>
                <div class="link-card" onclick="showTab('map')">🌳 Radstock</div>
            </div>
        </div>
        <div id="search-results" style="margin-top:20px;"></div>
    </div>

    <div id="map-screen" class="screen" style="padding:0;"><div id="live-map" style="height:100%"></div></div>

    <div id="fares-screen" class="screen">
        <h3>Ticket Wallet (VC€)</h3>
        <p>Radstock-Bristol: <b>VC€ 5.50</b></p>
    </div>

    <nav>
        <button class="active-nav" onclick="showTab('home', this)">🔍 Search</button>
        <button onclick="showTab('map', this)">🗺️ Map</button>
        <button onclick="showTab('fares', this)">🎟️ Tickets</button>
    </nav>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const API_KEY = '5fd1f1f6d3cade37b6edd3bb37192708d2b262dd';
    // Expanded Bounding Box: Includes Bristol, Bath, and Radstock
    const LARGE_BBOX = '-2.72,51.27,-2.30,51.52';
    let map, markers = {};

    async function fetchUpdates() {
        const url = `https://data.bus-data.dft.gov.uk/api/v1/datafeed/?boundingBox=${LARGE_BBOX}&api_key=${API_KEY}`;
        const proxy = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;

        try {
            const res = await fetch(proxy);
            const text = await res.text();
            const xml = new DOMParser().parseFromString(text, "text/xml");
            const buses = Array.from(xml.getElementsByTagName("VehicleActivity"));
            
            if (map) updateMapMarkers(buses);
        } catch (e) { console.error("Sync error"); }
    }

    function updateMapMarkers(buses) {
        buses.forEach(b => {
            const id = b.getElementsByTagName("VehicleRef")[0]?.textContent;
            const lat = b.getElementsByTagName("Latitude")[0]?.textContent;
            const lon = b.getElementsByTagName("Longitude")[0]?.textContent;
            const line = b.getElementsByTagName("PublishedLineName")[0]?.textContent;

            if (lat && lon && id) {
                if (markers[id]) {
                    // Smoothly move existing marker
                    markers[id].setLatLng([lat, lon]);
                } else {
                    // Create new styled marker
                    const customIcon = L.divIcon({
                        className: 'bus-icon-div',
                        html: `<span>${line}</span>`,
                        iconSize: [30, 30]
                    });
                    markers[id] = L.marker([lat, lon], { icon: customIcon }).addTo(map)
                        .bindPopup(`<b>Route ${line}</b><br>Heading to destination...`);
                }
            }
        });
    }

    function showTab(tab, btn) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active-nav'));
        document.getElementById(tab + '-screen').classList.add('active');
        if(btn) btn.classList.add('active-nav');

        if (tab === 'map' && !map) {
            map = L.map('live-map').setView([51.3814, -2.3589], 11);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            // Initial markers fetch
            fetchUpdates();
        }
        if (map) setTimeout(() => map.invalidateSize(), 200);
    }

    // High frequency simulation: Fetch data every 5s, but we'll simulate 1s updates locally
    setInterval(fetchUpdates, 5000); 
    
    // To handle the "Search" part:
    function filterResults(val) {
        const res = document.getElementById('search-results');
        if (val.length < 2) { res.innerHTML = ''; return; }
        res.innerHTML = `<div style="padding:10px; background:white; border-radius:10px;">Searching routes for "${val}"...</div>`;
    }
</script>
</body>
</html>
