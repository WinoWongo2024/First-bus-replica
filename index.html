<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>First Bus - ÖestVèl Edition</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --first-magenta: #e3007b;
            --first-purple: #4a154b;
            --bg-light: #f8f9fa;
            --shimmer: #eeeeee;
        }

        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #222; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #app-shell { width: 375px; height: 750px; background: var(--bg-light); border-radius: 35px; overflow: hidden; position: relative; display: flex; flex-direction: column; border: 8px solid #333; }
        
        header { background: var(--first-purple); color: white; padding: 18px; text-align: center; font-weight: 700; border-bottom: 5px solid var(--first-magenta); }

        /* --- LOADING SHIMMER EFFECT --- */
        .shimmer-wrapper { padding: 10px; display: none; }
        .shimmer-card { height: 70px; background: white; margin-bottom: 10px; border-radius: 12px; position: relative; overflow: hidden; }
        .shimmer-card::after {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

        /* --- APP CONTENT --- */
        .screen { flex: 1; display: none; overflow-y: auto; }
        .screen.active { display: block; }
        .departure-card { background: white; margin: 10px; padding: 15px; border-radius: 12px; display: flex; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .route-badge { background: var(--first-magenta); color: white; width: 45px; height: 35px; display: flex; justify-content: center; align-items: center; border-radius: 6px; font-weight: bold; margin-right: 15px; }
        .dest-name { font-weight: 600; font-size: 0.9rem; color: #333; text-transform: capitalize; }
        .live-label { color: var(--first-magenta); font-size: 0.7rem; font-weight: bold; margin-top: 3px; }

        /* --- NAVIGATION --- */
        nav { background: white; height: 70px; display: flex; border-top: 1px solid #ddd; }
        nav button { flex: 1; border: none; background: none; color: #888; font-size: 0.75rem; cursor: pointer; }
        nav button.active-nav { color: var(--first-magenta); font-weight: bold; }
        .nav-icon { font-size: 1.3rem; display: block; margin-bottom: 2px; }

        #live-map { height: 100%; width: 100%; }
    </style>
</head>
<body>

<div id="app-shell">
    <header>Live Updates</header>

    <div id="list-screen" class="screen active">
        <div id="loading-view" class="shimmer-wrapper">
            <div class="shimmer-card"></div><div class="shimmer-card"></div><div class="shimmer-card"></div>
        </div>
        <div id="departure-container"></div>
    </div>

    <div id="map-screen" class="screen"><div id="live-map"></div></div>

    <div id="tickets-screen" class="screen" style="padding:20px;">
        <h3>M-Tickets</h3>
        <div style="background:white; padding:15px; border-radius:10px; border-left:4px solid var(--first-magenta);">
            <strong>Bath Adult Single</strong><br><span style="font-size:1.5rem">VC€ 2.00</span>
        </div>
    </div>

    <nav>
        <button id="btn-list" class="active-nav" onclick="showTab('list')"><span class="nav-icon">🕒</span>Times</button>
        <button id="btn-map" onclick="showTab('map')"><span class="nav-icon">📍</span>Map</button>
        <button id="btn-tickets" onclick="showTab('tickets')"><span class="nav-icon">🎟️</span>Tickets</button>
    </nav>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // Security: Obfuscated logic. We don't mention BODS in the UI anymore.
    const _KEY = '5fd1f1f6d3cade37b6edd3bb37192708d2b262dd';
    const _BND = '-2.45,51.35,-2.30,51.43'; 
    const _OP = 'FBRI'; 

    let map;
    let markers = [];

    function cleanStr(s) { 
        return s ? s.replace(/__/g, ' ').replace(/_/g, ' ').trim() : "Service Terminus"; 
    }

    async function updateData() {
        const loader = document.getElementById('loading-view');
        const container = document.getElementById('departure-container');
        
        // Show shimmer, hide old data
        loader.style.display = 'block';
        container.style.opacity = '0.3';

        const api = `https://data.bus-data.dft.gov.uk/api/v1/datafeed/?operatorRef=${_OP}&boundingBox=${_BND}&api_key=${_KEY}`;
        const proxy = `https://api.allorigins.win/raw?url=${encodeURIComponent(api)}`;

        try {
            const res = await fetch(proxy);
            const text = await res.text();
            const xml = new DOMParser().parseFromString(text, "text/xml");
            const buses = xml.getElementsByTagName("VehicleActivity");

            container.innerHTML = '';
            
            if (buses.length === 0) {
                container.innerHTML = '<p style="text-align:center; padding:20px;">No vehicles tracked in this area.</p>';
            }

            for (let i = 0; i < Math.min(buses.length, 8); i++) {
                const line = buses[i].getElementsByTagName("PublishedLineName")[0]?.textContent || "-";
                const dest = buses[i].getElementsByTagName("DestinationName")[0]?.textContent;
                
                const card = document.createElement('div');
                card.className = 'departure-card';
                card.innerHTML = `
                    <div class="route-badge">${line}</div>
                    <div class="dest-info">
                        <div class="dest-name">${cleanStr(dest)}</div>
                        <div class="live-label">● LIVE</div>
                    </div>
                `;
                container.appendChild(card);
            }
            updateMap(buses);
        } catch (err) {
            container.innerHTML = '<p style="text-align:center; color:red;">Network slow. Retrying...</p>';
        } finally {
            loader.style.display = 'none';
            container.style.opacity = '1';
        }
    }

    function updateMap(buses) {
        if (!map) return;
        markers.forEach(m => map.removeLayer(m));
        markers = [];
        for (let b of buses) {
            const lat = b.getElementsByTagName("Latitude")[0]?.textContent;
            const lon = b.getElementsByTagName("Longitude")[0]?.textContent;
            if (lat && lon) {
                const m = L.marker([lat, lon]).addTo(map);
                markers.push(m);
            }
        }
    }

    function showTab(t) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active-nav'));
        document.getElementById(t + '-screen').classList.add('active');
        document.getElementById('btn-' + t).classList.add('active-nav');
        if (t === 'map' && !map) {
            map = L.map('live-map').setView([51.3814, -2.3589], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        }
        if (map) setTimeout(() => map.invalidateSize(), 200);
    }

    // Initial load
    updateData();
    setInterval(updateData, 45000); // Update every 45s to avoid hitting API limits
</script>
</body>
</html>
